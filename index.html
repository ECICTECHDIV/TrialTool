<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>染整工具箱</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1F2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="染整工具箱">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

<style>
  :root{
    --bg:#F2F4F5;
    --header-bg:#1F2937;
    --surface:#fff;
    --border:#E1E4E8;
    --ink:#1B2734;
    --ink-soft:#5B6B79;
    --cpb:#2563EB;
    --exhaust:#1D5C6E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  header{
    background:var(--header-bg);
    color:#fff;
    padding:28px 20px 24px;
  }
  header h1{margin:0 0 6px;font-size:1.5rem;}
  header p{margin:0;color:#B8C1CC;font-size:.9rem;}
  .shell{max-width:640px;margin:0 auto;padding:20px 16px 40px;}

  .tool-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:-16px;
  }
  @media (max-width:420px){
    .tool-grid{grid-template-columns:1fr;}
  }
  .tool-card{
    display:block;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 16px;
    text-align:center;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    border-top:4px solid var(--accent);
  }
  .tool-card .tool-icon{
    width:44px;height:44px;
    margin:0 auto 12px;
    border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .tool-card .tool-icon svg{width:24px;height:24px;}
  .tool-card .tool-name{font-weight:700;font-size:1.05rem;margin-bottom:4px;}
  .tool-card .tool-desc{font-size:.8rem;color:var(--ink-soft);}

  .section-title{
    font-size:1.05rem;
    font-weight:700;
    margin:32px 0 12px;
    color:var(--ink);
  }
  .doc-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .doc-link{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    color:var(--ink);
    font-weight:700;
    text-decoration:none;
    font-size:.92rem;
  }
  .doc-link::before{content:"📄";font-size:1.1rem;}
  .doc-link:active{background:#F5F6F7;}

  footer{
    text-align:center;
    padding:24px 16px 40px;
    font-size:.82rem;
  }
  footer a{color:var(--ink-soft);}
</style>
</head>
<body>

<header>
  <h1>染整工具箱</h1>
  <p>選擇要使用的工具</p>
</header>

<div class="shell">
  <div class="tool-grid">
    <a class="tool-card" style="--accent:var(--cpb)" href="https://ecictechdiv.github.io/CPB-Recipe-Calculator/">
      <div class="tool-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 14h9"/></svg>
      </div>
      <div class="tool-name">CPB 冷軋堆</div>
      <div class="tool-desc">CPB 染色配方計算</div>
    </a>
    <a class="tool-card" style="--accent:var(--exhaust)" href="https://ecictechdiv.github.io/Exhaust-Production/">
      <div class="tool-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l4-8 5 3 5-9 4 6"/></svg>
      </div>
      <div class="tool-name">浸染試染工具</div>
      <div class="tool-desc">配方鹽鹼建議・染程曲線</div>
    </a>
  </div>

  <div class="section-title">參考資料</div>
  <div class="doc-list">
    <a href="./everzol-manual.pdf" class="doc-link">Everzol 技術手冊</a>
    <a href="./everzol-erc-solution.pdf" class="doc-link">Everzol ERC Solution（永續染整解決方案）</a>
    <a href="./everacid-everset-manual.pdf" class="doc-link">Everacid／Everset 技術手冊</a>
    <a href="./everzol-continuous-dyeing-manual.pdf" class="doc-link">Everzol 連染技術手冊</a>
  </div>
</div>

<footer>
  <a href="https://everlight-ccbu.com/">everlight-ccbu.com</a>
</footer>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(err=>{
      console.error("Service worker registration failed:", err);
    });
  });
}
</script>
</body>
</html>
